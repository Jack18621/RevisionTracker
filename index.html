<!doctype html>
<html lang='en'>
<head>
<meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>study</title>
<link rel='stylesheet' href='./assets/styles.css'>
<link href='https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap' rel='stylesheet'>
</head>
<body>
<header class='topbar'>
  <button id='brandBtn' class='brand'><span class='dot'></span>study</button>
  <button id='settingsBtn' class='pill'>Settings</button>
</header>
<main class='container'>
  <section class='hero card' id='hero'>
    <div class='emoji'>🎓</div><h1>Hello, Jack</h1>
    <div class='chips'><div class='chip'><span>🔥</span><div><b>Daily Streak</b><small>Keep it up! 0 day(s)</small></div></div>
    <div class='chip muted'><span>🔒</span><div><b>Leaderboard</b><small>Coming soon</small></div></div></div>
  </section>
  <section class='filters card' id='filters'>
    <div class='row'>
      <div class='field'><label>Paper</label><select id='paperSel'></select></div>
      <div class='field'><label>Topic</label><select id='topicSel'></select></div>
      <div class='field'><label>Subtopic</label><select id='subtopicSel'></select></div>
      <div class='field'><label>Mode</label><select id='modeSel'><option>Loading…</option></select></div>
      <div class='field align-end'><button id='startBtn' class='primary xl'>Start</button></div>
    </div>
  </section>
  <section id='playCard' class='card hidden'>
    <div class='play-head'><div class='badge' id='questionMeta'>MCQ • Q 1/10</div>
    <div class='progress'><div id='pbar'></div></div></div>
    <div id='questionBody' class='q-body'></div>
    <div id='controls' class='q-ctrls'></div>
    <div id='explain' class='explain hidden'></div>
    <div class='nav'><button id='prevBtn' class='pill'>Prev</button><button id='nextBtn' class='pill'>Next</button></div>
  </section>
</main>
<div id='settingsOverlay' class='overlay hidden' role='dialog' aria-modal='true'>
  <div class='settings card'>
    <div class='settings-head'><h2>Settings</h2><button id='closeSettings' class='pill light'>Close</button></div>
    <div class='settings-body'>
      <label class='switch'><input id='sfxToggle' type='checkbox'><span>Enable sound effects</span></label>
      <label class='switch'><input id='shuffleToggle' type='checkbox' checked><span>Shuffle questions</span></label>
      <label class='number'><span>Questions per session</span><input id='qCount' type='number' min='1' step='1' value='20'></label>
    </div>
  </div>
</div>
<div class='toast' role='status' aria-live='polite'></div>
<script src='./assets/app.js'></script>
</body></html>
